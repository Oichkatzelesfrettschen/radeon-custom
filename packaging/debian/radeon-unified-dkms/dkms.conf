PACKAGE_NAME="radeon-palm-gate"
PACKAGE_VERSION="1.0"

# This DKMS package rebuilds the in-tree radeon driver with five
# steinmarder patches applied:
#   0001 -- bounded-MC-wait abort in evergreen_gpu_soft_reset
#   0002 -- evergreen_gpu_pci_config_reset_safe (bounded MC-wait
#           variant) with CHIP_PALM refuse-by-default gate
#   0003 -- /sys/kernel/debug/radeon_force_pci_reset_safe trigger
#   0004 -- radeon.palm_pci_reset_unsafe module parameter
#   0005 -- DRM_RADEON_PERF_QUERY ioctl (W10): unprivileged batch
#           readback of Evergreen / TeraScale-2 perf-counter MMIO
#           for VK_KHR_performance_query + GL_AMD_performance_monitor
#   0006-0009 -- CS observer (W11): read-only, disabled-by-default
#           Command-Stream observer co-located with the radeon module.
#           Components: module init + debugfs root + module-param
#           surface (palm_cs_observer, palm_cs_observer_comm,
#           palm_cs_observer_max_bytes, palm_cs_observer_max_events);
#           1 MiB shared ring buffer with debugfs events.jsonl
#           seq_file reader; per-tgid event-counter table; and four
#           hook callsites in radeon_cs.c (cs_ioctl_entry,
#           ib_chunk_pre_parse, packet_decode-merged-into-
#           ib_post_validate at the radeon_cs_parser_fini landmark).
#           Both W10 and W11 are env-gated in prep-source.sh
#           (RADEON_PALM_GATE_W10=1 / _W11=1) so the canonical build
#           keeps stage-OFF semantics.
#
# Plus W9.k as a one-line append to drivers/gpu/drm/radeon/reg_srcs/evergreen:
#   0x0000A020 SMX_DC_CTL0
# (regenerates evergreen_reg_safe.h via mkregtable at build time)
#
# The W10 patch is staged from w10-sources/ rather than as an in-tree
# unified diff because it adds two whole new translation units; the
# prep-source.sh script copies + wires them at PRE_BUILD time.
#
# Build flow per kernel:
#   PRE_BUILD prep-source.sh extracts /usr/src/linux-source-6.18.tar.xz
#   (Debian linux-source-6.18 package) into ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/radeon/,
#   applies the 4 patches + the reg_srcs/evergreen addition, then
#   leaves a buildable radeon/ subdir for MAKE[0].

BUILT_MODULE_NAME[0]="radeon"
BUILT_MODULE_LOCATION[0]="radeon"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# clang-22 + ld.lld-22 are the canonical toolchain on x130e for
# all steinmarder + mesa-26-gororoba builds (the distcc cluster's
# baseline).  The 6.18-x64v1-xanmod kernel itself was built with
# clang-19, but the compiler mismatch is cosmetic on this kernel
# because CONFIG_MODVERSIONS is off and vermagic does not include
# the compiler version.  Override via RADEON_PALM_GATE_CLANG_VERSION=19
# in the build env if the resulting module ever fails to load.
#
# distcc mesh: x130e is a 2-core Bobcat (~10 minutes of clang
# compile time per dkms build on its own); a reachable distcc mesh
# can cut that to ~1-2 minutes.  prep-source.sh reads the operator
# hosts profile, drops unreachable hosts, and falls back cleanly to
# local compile.  The mesh discovery and CC wrapping happens inside
# prep-source.sh, which writes the concrete MAKE invocation into
# ${dkms_tree}/.../build/MAKE.sh and points MAKE[0] at that wrapper.

MAKE[0]="sh ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/MAKE.sh ${kernelver}"

CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/radeon clean 2>/dev/null || true"

PRE_BUILD="prep-source.sh"

REMAKE_INITRD="yes"
AUTOINSTALL="yes"
