# Foreign radeon modprobe option files the kernel-module lane currently
# sanctions as live experiments.  One basename per line; blank lines and
# comment lines are ignored.
#
# Discipline: an entry here is OWNER-MANAGED experiment state, not policy.
# The RS482 conformance board must not absorb an experiment file into the
# package-owned radeon-re.conf; the kernel-module lane either retains the
# entry (experiment ongoing), removes the file and the entry (experiment
# concluded), or promotes the option into radeon-re.conf with a policy
# review.  check_radeon_unified_runtime_policy.sh reports an allowlisted
# file informationally instead of counting a policy failure.
#
# radeon-snoop-experiment.conf carries the rs480_gart_snoop /
# rs480_atomic_rmw_report experiment knobs.
radeon-snoop-experiment.conf
