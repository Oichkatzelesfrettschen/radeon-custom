# Ensure the DKMS Radeon module is present in early userspace.
#
# The Vostro RS482/RS485 display is driven by radeon during early boot, and
# mkinitcpio autodetect can otherwise include DRM helpers without including
# the package-provided updates/dkms/radeon.ko image.  Keep this as a drop-in
# instead of editing /etc/mkinitcpio.conf directly.
MODULES+=(radeon)
