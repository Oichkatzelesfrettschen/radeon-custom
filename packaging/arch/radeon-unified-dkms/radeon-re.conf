# Package-owned production policy for the RS482 Vostro 1000.

options radeon modeset=1
# The RS482 shared-memory path does not use AGP scratch writeback reliably.
options radeon no_wb=1
# RS4xx has no supported Radeon DPM implementation.
options radeon dpm=0
# Runtime suspension obscures containment state on the integrated GPU.
options radeon runpm=0
# The bounded RS4xx reset path includes the PCI reset stage.
options radeon hard_reset=1
# RS482 supports PCIe generation 1 link operation.
options radeon pcie_gen2=0
# Display fetch priority protects the shared-memory scanout path.
options radeon disp_priority=2
# Link power transitions remain disabled on the RS485M bridge.
options radeon aspm=0
# RS4xx ATOMBIOS supplies the display topology on this platform.
options radeon r4xx_atom=1
# Failure state remains available for attended recovery.
options radeon lockup_timeout=0
# RS482 exposes neither UVD nor VCE hardware.
options radeon uvd=0
options radeon vce=0
# Module self-tests and benchmarks never run during normal boot.
options radeon benchmark=0
options radeon test=0
