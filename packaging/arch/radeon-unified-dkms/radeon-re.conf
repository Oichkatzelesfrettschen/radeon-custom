# Package-owned radeon module parameters for RS482/RS485 reverse engineering.
# Only parameters confirmed present in modinfo radeon output are set here.
# Changes take effect on next module reload; reboot is required while radeon is in use.
# Do not keep extra /etc/modprobe.d/*radeon-forensic.conf overrides beside
# this file; fold new RS482 policy here so pacman owns the runtime contract.

options radeon modeset=1
# Disable AGP writeback for scratch registers on the RS482 shared-memory path.
options radeon no_wb=1
# Do not force an alternate connector table; use ATOMBIOS/DMI-discovered wiring.
options radeon connector_table=0
# DPM is broken/unsupported on RS4xx IGP; disable to prevent instability.
options radeon dpm=0
# Keep dynamic clocks disabled so register snapshots do not cross clock domains.
options radeon dynclks=0
# BAPM is not applicable to RS480; disable explicitly so auto does not misfire.
options radeon bapm=0
# Disable runtime PM so GPU registers stay accessible for MMIO probing.
options radeon runpm=0
# Hard reset path exposes more GPU state during recovery; enables PCI config reset.
options radeon hard_reset=1
# RS482 is PCIe 1.x only; prevent gen2 negotiation from corrupting the link.
options radeon pcie_gen2=0
# MSI: let auto decide; RS482 has bridge MSI quirks, -1 = auto is safest.
options radeon msi=-1
# TV-out: enable so TVDAC encoder registers are live and probeable.
options radeon tv=1
# Prefer display fetch priority over marginal 3D throughput on shared-memory IGP.
options radeon disp_priority=2
# Enable the hardware I2C engine so DDC/I2C state is available during RE work.
options radeon hw_i2c=1
# Audio: enable to bring display engine audio path registers online.
options radeon audio=1
# Custom RS482 RE aperture: use a 1024 MB PCIE/IGP GART for large BO pressure.
options radeon gartsize=1024
# Fast framebuffer access for IGP: enable for direct BAR reads.
options radeon fastfb=1
# GART mode: -1 = auto (PCI/AGP autodetect); do not override.
options radeon agpmode=-1
# Disable ASPM to prevent link power states from masking register activity.
options radeon aspm=0
# No VRAM limit; use all available shared VRAM.
options radeon vramlimit=0
# Use r4xx ATOMBIOS modesetting path; RS485 has ATOMBIOS and exposes more regs.
options radeon r4xx_atom=1
# Preserve failure state for RCA; operator-triggered recovery is explicit.
options radeon lockup_timeout=0
# Keep stock pageflip IRQ behavior explicit for compositor/DRI debugging.
options radeon use_pflipirq=2
# RS482 has no deep-color display path; keep 24-bit-era output stable.
options radeon deep_color=0
# Let the kernel pick the backlight provider and AUX policy.
options radeon backlight=-1
options radeon auxch=-1
# The RS482 Vostro has no UVD/VCE blocks; disable their paths explicitly.
options radeon uvd=0
options radeon vce=0
# Do not run module self-tests or benchmarks during normal boot.
options radeon benchmark=0
options radeon test=0
# DKMS-only RE probe: expose the read-only RS480/RS482/RS485 safe-reg debugfs snapshot.
options radeon rs480_safe_regs=1
# DKMS-only candidate probe: expose bounded unpromoted candidates for RS482 validation.
options radeon rs480_candidate_regs=1
