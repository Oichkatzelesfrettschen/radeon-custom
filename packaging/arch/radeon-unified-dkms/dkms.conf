PACKAGE_NAME="radeon-unified"
PACKAGE_VERSION="0.3"
radeon_kernel_build_root=${R300_RS480_KERNEL_BUILD_ROOT:-/lib/modules/${kernelver}/build}
printf -v radeon_kernel_build_root_q '%q' "$radeon_kernel_build_root"
radeon_dkms_build_root="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
printf -v radeon_dkms_helper_q '%q' \
    "${radeon_dkms_build_root}/radeon-dkms-make"
printf -v radeon_dkms_compiler_q '%q' \
    "${radeon_dkms_build_root}/radeon-dkms-compiler"
printf -v radeon_dkms_module_q '%q' "${radeon_dkms_build_root}/radeon"
printf -v radeon_kernel_release_q '%q' "$kernelver"
radeon_parallel_arg=
if [ "${parallel_jobs+x}" = x ]; then
    case $parallel_jobs in
        '')
            radeon_parallel_arg=-j
            ;;
        *[!0-9]*)
            printf 'dkms.conf: invalid DKMS parallel job count: %s\n' \
                "$parallel_jobs" >&2
            return 1
            ;;
        *)
            radeon_parallel_arg="-j${parallel_jobs}"
            ;;
    esac
fi

# The package installs the exact Radeon subtree exported from the signed source
# equivalence tag. DKMS copies that tree into its private build directory and
# builds generated register headers from the tracked reg_srcs inputs. No DKMS
# patch phase or package-time source mutation participates in this constructor.
#
# Compiler selection is owned by compiler-policy.conf and
# radeon-dkms-compiler-policy. radeon-dkms-make preserves trusted root
# KCFLAGS, adds the package release flags exactly once, and removes userspace
# compiler flags and GNU make control variables before Kbuild starts.

BUILT_MODULE_NAME[0]="radeon"
BUILT_MODULE_LOCATION[0]="radeon"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="R300_RS480_KERNEL_BUILD_ROOT=${radeon_kernel_build_root_q} ${radeon_dkms_helper_q}${radeon_parallel_arg:+ ${radeon_parallel_arg}} KERNELRELEASE=${radeon_kernel_release_q} CC=${radeon_dkms_compiler_q} -C ${radeon_kernel_build_root_q} M=${radeon_dkms_module_q} modules"

PRE_BUILD="pre-build.sh ${kernelver} ${radeon_kernel_build_root_q}"
POST_INSTALL="dkms-initramfs-refresh.sh"

AUTOINSTALL="yes"
