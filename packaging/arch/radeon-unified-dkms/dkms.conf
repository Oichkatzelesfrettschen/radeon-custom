PACKAGE_NAME="radeon-unified"
PACKAGE_VERSION="0.3"

# This DKMS package rebuilds the in-tree radeon driver with the canonical
# steinmarder Radeon patchset applied in the generated source tarball:
#   - 7.x API compatibility for current CachyOS mainline kernels
#   - rs480_safe_regs read-only debugfs reader
#   - rs480_candidate_regs read-only debugfs reader for bounded candidates
#   - Palm unsafe PCI reset refusal unless palm_pci_reset_unsafe=1
#   - radeon_force_pci_reset_safe debugfs trigger
#   - SMX_DC_CTL0 definitions and allowlist material for Evergreen-family work
#
# The patch adds a read-only seq_file that emits a curated list of BAR0
# MMIO register values for the RS400/RS480 chip family (RS482 1002:5974,
# RS485 1002:5975).
#
# Debugfs path in this unified package: patch 0009 registers the RS480 RE nodes
# from drm_driver.debugfs_init after the primary minor debugfs_root exists, so
# validation should look under /sys/kernel/debug/dri/N/.  Older pre-0009 pkgrels
# that called the init helpers from rs400_init() could place nodes at the debugfs
# top level on kernels where primary->debugfs_root was not yet populated.
#
# Register list is in SAFE_REGS.tsv (same directory as dkms.conf).
# Source: rs400.c (handles both rs400 and rs480 in upstream radeon DRM).
#
# Build flow per kernel:
#   The Arch package installs the full pre-patched radeon source tree at
#   /usr/src/radeon-unified-${PACKAGE_VERSION}/radeon/.  DKMS copies
#   that tree into ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ for
#   each kernel.  PRE_BUILD stages radeon_trace.h only when kernel headers do
#   not ship drivers/gpu/drm/radeon/radeon_trace.h; MAKE then builds the copied
#   radeon/ directory directly.
#
# Compiler selection (CC):
#   Owned by compiler-policy.conf and radeon-dkms-compiler-policy.
#   The default compiler family is detected from compile.h in the target kernel
#   build tree: clang kernels select clang, GCC kernels select gcc.
#   Cache mode defaults to ccache when available.  Distcc defaults to off, but
#   plain distcc is enabled automatically when RADEON_DKMS_DISTCC_HOSTS is set.
#   Pump is intentionally unsupported because DKMS rebuilds consume generated
#   kernel headers and per-kernel ABI state.
#   Supported overrides:
#     RADEON_DKMS_COMPILER_FAMILY=auto|clang|gcc
#     RADEON_DKMS_CLANG_BIN=<clang-binary>
#     RADEON_DKMS_GCC_BIN=<gcc-binary>
#     RADEON_DKMS_CACHE_MODE=auto|ccache|off
#     RADEON_DKMS_DISTCC_MODE=auto|plain|off
#     RADEON_DKMS_DISTCC_HOSTS='<hostspec>'
#   EXTRA_CFLAGS='-O2 -pipe' aligns with the kernel's release build profile.
#
# Target hardware: Vostro 1000 RS482/RS485 IGP and x130e Palm/Wrestler
# Tested kernels:  6.18.32-1-cachyos-lts and 7.0.9-1-cachyos on cachyos-vostro1000

BUILT_MODULE_NAME[0]="radeon"
BUILT_MODULE_LOCATION[0]="radeon"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="R300_RS480_KERNEL_BUILD_ROOT=/lib/modules/${kernelver}/build make CC=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/radeon-dkms-compiler EXTRA_CFLAGS='-O2 -pipe' -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/radeon modules"

PRE_BUILD="pre-build.sh ${kernelver}"

# Rebuild the boot initramfs after every install so the freshly built radeon
# module reaches the boot image.  A bare `dkms install` writes only /lib/modules;
# on a Limine ESP-hash system the boot initramfs is stale until it is rebuilt,
# redeployed, and rehashed together.  dkms-initramfs-refresh.sh prefers
# limine-mkinitcpio and falls back across distributions.
POST_INSTALL="dkms-initramfs-refresh.sh"

AUTOINSTALL="yes"

