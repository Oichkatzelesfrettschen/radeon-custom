#!/bin/sh
# Package-owned defaults for unified Radeon DKMS compiler selection.

: "${RADEON_DKMS_COMPILER_FAMILY:=auto}"
: "${RADEON_DKMS_CLANG_BIN:=clang}"
: "${RADEON_DKMS_GCC_BIN:=gcc}"
: "${RADEON_DKMS_CACHE_MODE:=auto}"
: "${RADEON_DKMS_DISTCC_MODE:=auto}"
: "${RADEON_DKMS_DISTCC_HOSTS:=${DISTCC_HOSTS:-}}"
