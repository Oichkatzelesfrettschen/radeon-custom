# Post-merge qualification on the RS482 machine.
#
# This workflow runs on the target host after the protected-main gates pass.
# A pull request carries unmerged repository-controlled code, and the target
# machine is the one piece of hardware this project cannot replace. The gates
# workflow supplies its verified production package as an immutable artifact,
# so the target host needs no checkout or credential for the private source
# repository.
#
# The job compiles and verifies. It loads no module, arms no hazard gate, and
# performs no register access. Reading PCI identity from sysfs reports the
# enumeration the kernel already performed at boot and drives nothing on the
# device. Hardware operation stays an attended run with a recorded preflight,
# and its verdicts live in steinmarder-r300.
name: target-kernel

on:
  workflow_run:
    workflows: [gates]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  target-kernel:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, cachyos-target, target-host]
    timeout-minutes: 60
    env:
      GATE_EVENT: ${{ github.event.workflow_run.event }}
      GATE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      GATE_RUN_ID: ${{ github.event.workflow_run.id }}
      GATE_SHA: ${{ github.event.workflow_run.head_sha }}
      GATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PACKAGE_ARTIFACT: radeon-unified-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          clean: true

      - name: Gate run is successful protected main
        run: |
          set -euo pipefail
          [ "$GATE_EVENT" = push ]
          [ "$GATE_BRANCH" = main ]
          [ "$GATE_REPOSITORY" = "$GITHUB_REPOSITORY" ]
          [ "$(git rev-parse HEAD)" = "$GATE_SHA" ]
          target_evidence="${RUNNER_TEMP}/radeon-target-evidence"
          mkdir -p "$target_evidence"
          {
            printf 'gate_run_id=%s\n' "$GATE_RUN_ID"
            printf 'gate_sha=%s\n' "$GATE_SHA"
            printf 'gate_repository=%s\n' "$GATE_REPOSITORY"
          } >"$target_evidence/gate-run.txt"
          echo "successful protected-main gate admitted: $GATE_RUN_ID at $GATE_SHA"

      - name: Download gate-verified package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: ${{ runner.temp }}/radeon-gates-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      # Fail closed. A mislabeled runner, a replaced GPU, or a machine without
      # the part must not produce a green target verdict, so every load-bearing
      # identity is asserted rather than reported. sysfs is read instead of
      # lspci prose because these files are stable identifiers rather than
      # localized text.
      - name: Target identity is the RS482 machine
        run: |
          assert_id() {
            path=$1 field=$2 want=$3
            [ -r "$path/$field" ] || {
              echo "cannot read $path/$field" >&2; exit 1; }
            got=$(cat "$path/$field")
            [ "$got" = "$want" ] || {
              echo "$path/$field is $got, expected $want" >&2; exit 1; }
            echo "  $path/$field = $got"
          }

          # The integrated GPU: the part every retained hardware claim binds to.
          gpu=/sys/bus/pci/devices/0000:01:05.0
          assert_id "$gpu" vendor 0x1002
          assert_id "$gpu" device 0x5974
          assert_id "$gpu" subsystem_vendor 0x1028
          assert_id "$gpu" subsystem_device 0x022a

          # The host bridge: the RS485M chipset that names the platform.
          host=/sys/bus/pci/devices/0000:00:00.0
          assert_id "$host" vendor 0x1002
          assert_id "$host" device 0x5950

          echo "target identity confirmed: RS482 1002:5974 on an RS485M platform"
          echo "kernel: $(uname -r)"

      - name: Gate-verified production package compiles on the target kernel
        run: |
          set -euo pipefail
          packages=$(find "${RUNNER_TEMP}/radeon-gates-artifact" -type f \
            -name 'radeon-unified-dkms-*.pkg.tar.zst' \
            ! -name 'radeon-unified-dkms-dev-*' | LC_ALL=C sort)
          [ "$(printf '%s\n' "$packages" | grep -c .)" -eq 1 ] || {
            echo "artifact does not contain exactly one production package" >&2
            printf '%s\n' "$packages" >&2
            exit 1
          }
          package_path=$packages
          target_evidence="${RUNNER_TEMP}/radeon-target-evidence"
          sha256sum "$package_path" >"$target_evidence/production-package.sha256"
          mkdir -p "$HOME/.cache/gororoba-ci"
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            timeout 20m sh scripts/check_radeon_packaged_source_compiles.sh \
              --package "$package_path" \
              --kernel-build-root "/lib/modules/$(uname -r)/build" \
              | tee "$target_evidence/compile.log"

      - name: Upload target compile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radeon-target-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/radeon-target-evidence
          retention-days: 30
          if-no-files-found: warn
