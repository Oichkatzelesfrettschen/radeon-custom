# Packaging-repository gates on GitHub-hosted runners.
#
# The static and build jobs run in a digest-pinned Arch Linux container whose
# packages resolve through one dated Arch Linux Archive snapshot, so every
# compile verdict names an exact, signed kernel headers package:
# linux-headers supplies the 7.x build root and linux-lts-headers the pre-7.0
# root. The snapshot date and the pinned header versions change together in
# one commit.
#
# Every job runs on an ephemeral GitHub-hosted VM. The jobs run on
# pull_request, so they execute repository-controlled code from an unmerged
# branch, and a hosted VM is the isolation that makes that safe. Compilation
# against the RS482 target kernel is an attended manual run documented in
# ci/README.md.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH_ARCHIVE_SNAPSHOT: "2026/09/28"

jobs:
  # Resolve whether a pull request changes anything the kernel-build and
  # packaging jobs must recompile or reproduce. A Markdown-only change is
  # documentation and skips those jobs; every other path builds. package and
  # compat-6-18 are required ruleset contexts, and a required job skipped by a
  # job-level condition is treated as passing, so a documentation change still
  # merges. The dependent jobs read this output fail-closed: a failed or empty
  # classification builds rather than silencing the gate.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      # The verdict below runs under this VM's sh, so the calibration runs
      # under the same interpreter before the verdict is trusted.
      - name: Build-relevance classifier calibration
        run: sh scripts/classify_build_relevance.sh --self-test

      - name: Classify changed paths
        id: classify
        run: |
          set -eu
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "non-PR event ${{ github.event_name }}: full build"
            echo "build=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          verdict=$(git diff --name-only "$base" HEAD \
            | sh scripts/classify_build_relevance.sh)
          echo "classification: $verdict"
          echo "$verdict" >>"$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 20
    steps:
      # actions/checkout needs git inside the container to produce a
      # repository with history, so the toolchain installs before checkout.
      - name: Install the pinned Arch toolchain
        run: |
          set -eu
          echo "Server = https://archive.archlinux.org/repos/${ARCH_ARCHIVE_SNAPSHOT}/\$repo/os/\$arch" \
            >/etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed \
            git python ruff actionlint shellcheck dkms kmod openssh
          git config --system --add safe.directory '*'
          pacman -Q python ruff actionlint shellcheck dkms

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      # Each verdict-producing gate proves itself on known-good and known-bad
      # inputs before its tree verdict is trusted.
      - name: Build-relevance classifier calibration
        run: sh scripts/classify_build_relevance.sh --self-test

      - name: Prose gate calibration
        run: python3 scripts/check_project_prose_style.py --self-test

      - name: Prose gate
        run: python3 scripts/check_project_prose_style.py

      - name: Patch-series gate calibration
        run: sh scripts/check_radeon_patch_series_compiles.sh --self-test

      - name: Source-pin gate calibration
        run: python3 scripts/check_radeon_source_pin.py --self-test

      - name: Pinned-source build calibration
        run: sh scripts/check_radeon_pinned_source_compiles.sh --self-test

      - name: Job-private source export calibration
        run: sh scripts/export_radeon_ci_source_snapshot.sh --self-test

      - name: Shared build-root identity calibration
        run: python3 scripts/check_shared_build_root_identity.py --self-test

      - name: Packaged kernel build-root identity calibration
        run: sh scripts/check_packaged_kernel_build_root.sh --self-test

      - name: Packaged-source build calibration
        run: sh scripts/check_radeon_packaged_source_compiles.sh --self-test

      - name: Packaged development-source build calibration
        run: sh scripts/check_radeon_packaged_source_compiles.sh --self-test --profile all-dev

      - name: Base-delta closure calibration
        run: python3 scripts/check_base_delta_map_closure.py --self-test

      - name: GitHub action pin calibration
        run: python3 scripts/check_github_action_pins.py --self-test

      - name: GitHub action pins
        run: python3 scripts/check_github_action_pins.py

      - name: Target artifact admission calibration
        run: python3 scripts/admit_target_gate_artifact.py --self-test

      - name: Workflow artifact digest calibration
        run: python3 scripts/resolve_workflow_artifact_digest.py --self-test

      - name: Hazardous runner ownership calibration
        run: python3 scripts/check_hazardous_runner_ownership.py --self-test

      - name: Hazardous runner ownership
        run: python3 scripts/check_hazardous_runner_ownership.py

      - name: Package authority documentation calibration
        run: python3 scripts/check_radeon_package_authority_docs.py --self-test

      - name: Package authority documentation
        run: python3 scripts/check_radeon_package_authority_docs.py

      - name: Package historical-input ownership calibration
        run: python3 scripts/check_package_historical_input_ownership.py --self-test

      - name: Package historical-input ownership
        run: python3 scripts/check_package_historical_input_ownership.py

      - name: Display oracle lint calibration
        run: sh scripts/check_display_oracle_usage.sh --self-test

      - name: Display oracle lint
        run: sh scripts/check_display_oracle_usage.sh

      - name: Display-health oracle calibration
        run: sh scripts/check_radeon_display_health.sh --self-test

      - name: Runtime policy calibration
        run: bash scripts/check_radeon_unified_runtime_policy.sh --self-test

      - name: Runtime policy package inputs
        run: bash scripts/check_radeon_unified_runtime_policy.sh --check-files

      - name: ruff
        run: ruff check scripts/

      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: |
          shellcheck -S error scripts/*.sh \
            packaging/arch/radeon-unified-dkms/*.sh \
            packaging/arch/radeon-unified-dkms/radeon-dkms-make \
            packaging/arch/radeon-unified-dkms/radeon-profile-dev

      - name: Package profile calibration
        run: python3 scripts/check_radeon_package_profiles.py --self-test

      - name: Package QA calibration
        run: python3 scripts/check_radeon_package_qa.py --self-test

      - name: Package profiles
        run: python3 scripts/check_radeon_package_profiles.py

      - name: Development profile selector
        run: bash scripts/test_radeon_profile_dev.sh

      - name: DKMS KCFLAGS composition
        run: bash scripts/test_radeon_dkms_kcflags_composition.sh

      - name: DKMS lifecycle input calibration
        run: bash scripts/test_radeon_dkms_lifecycle.sh --self-test

      - name: Package transition temp-root calibration
        run: bash scripts/test_radeon_package_transitions.sh --self-test


  package:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    # The transition matrix bind-mounts its disposable root and arch-chroot
    # mounts proc, sys, and dev inside it, which needs a privileged container.
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --privileged
    timeout-minutes: 45
    env:
      KERNEL_HEADERS_PACKAGE: linux-headers
      KERNEL_HEADERS_VERSION: 7.2.7.arch1-1
      KERNEL_RELEASE: 7.2.7-arch1-1
    steps:
      # actions/checkout needs git inside the container to produce a
      # repository with history, so the toolchain installs before checkout.
      - name: Install the pinned Arch toolchain
        run: |
          set -eu
          echo "Server = https://archive.archlinux.org/repos/${ARCH_ARCHIVE_SNAPSHOT}/\$repo/os/\$arch" \
            >/etc/pacman.d/mirrorlist
          # The image's pacman.conf prunes documentation and etc/pacman.conf
          # through NoExtract. The transition matrix derives its fixture
          # configuration from this host's, and a fixture without
          # /etc/pacman.conf cannot run pacman inside the chroot.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          # The image ships its keyring without a local secret key. pacstrap
          # copies this keyring into the fixture, and the archlinux-keyring
          # scriptlet there signs the populated keys with the local key.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syyuu --noconfirm --needed \
            git python dkms kmod openssh arch-install-scripts pahole namcap \
            linux-headers
          git config --system --add safe.directory '*'
          pacman -Q python dkms pahole namcap linux-headers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      # makepkg refuses to run as root, and a compile run by an account that
      # cannot write the root-owned kernel build root leaves it unchanged by
      # construction; the identity manifests then confirm it.
      - name: Create the unprivileged build account
        run: |
          set -eu
          useradd --create-home --user-group builder
          builder_temp="${RUNNER_TEMP}/builder"
          install -d -o builder -g builder -m 0755 "$builder_temp"
          printf 'BUILDER_TEMP=%s\n' "$builder_temp" >>"$GITHUB_ENV"

      # KERNEL_VERSION(7, 0, 0) <= code < KERNEL_VERSION(8, 0, 0)
      - name: Verify the packaged 7.x build-root identity
        run: |
          set -euo pipefail
          verdict=$(sh scripts/check_packaged_kernel_build_root.sh \
            --package "$KERNEL_HEADERS_PACKAGE" \
            --version "$KERNEL_HEADERS_VERSION" \
            --release "$KERNEL_RELEASE" \
            --version-code-range 458752:524288)
          printf 'KERNEL_BUILD_ROOT_7X=%s\n' "${verdict#kernel_build_root=}" \
            >>"$GITHUB_ENV"

      # The public source repository is cloned with full history, because the
      # signed tags, the equivalence ancestry, and the recorded upstream tree
      # object all live in it. The source becomes a job private detached
      # checkout before repository code invokes package tooling, and the
      # recorded upstream Radeon tree becomes a job private archive from that
      # checkout. The kernel root is root-owned and read-only to the build
      # account, and a complete identity snapshot proves that every compile
      # leaves its files, modes, and symlink targets unchanged.
      - name: Prepare isolated 7.x source and build-root inputs
        run: |
          set -euo pipefail
          input_root="${RUNNER_TEMP}/radeon-build-inputs"
          mkdir -p "$input_root"
          source_repository=$(python3 -c \
            'import tomllib; print(tomllib.load(open("packaging/arch/radeon-unified-dkms/source-identity.toml", "rb"))["source_repository"])')
          git clone --quiet "https://github.com/${source_repository}.git" \
            "$input_root/source-origin"
          source_commit=$(python3 -c \
            'import tomllib; print(tomllib.load(open("packaging/arch/radeon-unified-dkms/source-identity.toml", "rb"))["source_commit"])')
          sh scripts/export_radeon_ci_source_snapshot.sh \
            --source-repository "$input_root/source-origin" \
            --source-commit "$source_commit" \
            --destination "$input_root/source"
          upstream_tree=$(sed -n \
            '/^\[/q;s/^subtree_tree[[:space:]]*=[[:space:]]*"\([0-9a-f]*\)".*/\1/p' \
            "$input_root/source/UPSTREAM_BASE.toml" | head -1)
          case $upstream_tree in
            *[!0-9a-f]* | '')
              echo "UPSTREAM_BASE.toml declares no lowercase tree object" >&2
              exit 1
              ;;
          esac
          [ "${#upstream_tree}" -eq 40 ] || {
            echo "UPSTREAM_BASE.toml tree object is not 40 hexadecimal characters" >&2
            exit 1
          }
          [ "$(git -C "$input_root/source" cat-file -t "$upstream_tree")" = tree ] || {
            echo "recorded upstream Radeon object is not a Git tree" >&2
            exit 1
          }
          upstream_radeon_tree="$input_root/upstream-radeon"
          mkdir "$upstream_radeon_tree"
          git -C "$input_root/source" archive "$upstream_tree" |
            tar -x -C "$upstream_radeon_tree"
          python3 scripts/check_radeon_source_pin.py \
            --identity packaging/arch/radeon-unified-dkms/source-identity.toml \
            --repository "$input_root/source" \
            --pkgbuild packaging/arch/radeon-unified-dkms/PKGBUILD
          python3 scripts/check_shared_build_root_identity.py \
            --root "$KERNEL_BUILD_ROOT_7X" \
            --write "$input_root/kernel-7.x.identity.tsv"
          {
            printf 'JOB_SOURCE_REPOSITORY=%s\n' "$input_root/source"
            printf 'JOB_UPSTREAM_RADEON_TREE=%s\n' "$upstream_radeon_tree"
            printf 'KERNEL_BUILD_ROOT_7X_IDENTITY=%s\n' \
              "$input_root/kernel-7.x.identity.tsv"
          } >>"$GITHUB_ENV"

      - name: PKGBUILD sha256sums
        run: bash packaging/arch/radeon-unified-dkms/check_pkgbuild_sha256sums.sh

      - name: DKMS source pin and package inputs
        run: |
          : "${JOB_SOURCE_REPOSITORY:?job-private source export is unset}"
          bash scripts/verify_radeon_unified_dkms_sources.sh \
            --source-repository "$JOB_SOURCE_REPOSITORY"

      # with_build_slot.sh bounds concurrent module builds on a host that
      # several runner services share. A hosted VM carries one job, so a slot
      # is always free, and the gate keeps exercising the wrapper that the
      # attended target-kernel compile also uses.
      - name: Pinned production and development source build against 7.x
        run: |
          set -eu
          for profile in prod all-dev; do
            runuser -u builder -- env RUNNER_TEMP="$BUILDER_TEMP" \
              sh scripts/with_build_slot.sh \
              timeout 15m sh scripts/check_radeon_pinned_source_compiles.sh \
                --source-repository "$JOB_SOURCE_REPOSITORY" \
                --kernel-build-root "$KERNEL_BUILD_ROOT_7X" \
                --profile "$profile"
          done

      - name: Verify 7.x build-root identity after pinned builds
        run: |
          python3 scripts/check_shared_build_root_identity.py \
            --root "$KERNEL_BUILD_ROOT_7X" \
            --verify "$KERNEL_BUILD_ROOT_7X_IDENTITY"

      - name: Build and verify deterministic split packages
        run: |
          set -euo pipefail
          PACKAGE_WORK="${RUNNER_TEMP}/radeon-package-artifacts"
          printf 'PACKAGE_WORK=%s\n' "$PACKAGE_WORK" >>"$GITHUB_ENV"
          mkdir -p "$PACKAGE_WORK/package"
          cp -a packaging/arch/radeon-unified-dkms/. "$PACKAGE_WORK/package/"
          chown -R builder:builder "$PACKAGE_WORK/package"
          (
            cd "$PACKAGE_WORK/package"
            runuser -u builder -- env \
              RADEON_UNIFIED_SOURCE_URL="git+file://${JOB_SOURCE_REPOSITORY}" \
              makepkg -fC --noconfirm
          )
          # shellcheck disable=SC2034
          startdir=packaging/arch/radeon-unified-dkms
          source packaging/arch/radeon-unified-dkms/PKGBUILD
          prod_package=$(find "$PACKAGE_WORK/package" -maxdepth 1 -type f \
            -name "radeon-unified-dkms-${pkgver}-${pkgrel}-*.pkg.tar.zst")
          dev_package=$(find "$PACKAGE_WORK/package" -maxdepth 1 -type f \
            -name "radeon-unified-dkms-dev-${pkgver}-${pkgrel}-*.pkg.tar.zst")
          policy_package=$(find "$PACKAGE_WORK/package" -maxdepth 1 -type f \
            -name "radeon-rs482-policy-${pkgver}-${pkgrel}-*.pkg.tar.zst")
          [ -f "$prod_package" ] && [ -f "$dev_package" ] && \
            [ -f "$policy_package" ] || {
            echo "makepkg did not produce the complete split package set" >&2
            exit 1
          }
          python3 scripts/check_radeon_package_qa.py \
            --package "$prod_package" \
            --package "$dev_package" \
            --package "$policy_package"
          printf 'POLICY_PACKAGE_PATH=%s\n' "$policy_package" >>"$GITHUB_ENV"
          for profile in prod dev; do
            if [ "$profile" = prod ]; then
              package_path=$prod_package
            else
              package_path=$dev_package
            fi
            verifier_output=$(bash scripts/verify_radeon_unified_dkms_package.sh \
              --source-repository "$JOB_SOURCE_REPOSITORY" \
              --package "$package_path")
            printf '%s\n' "$verifier_output"
            package_sha256=$(printf '%s\n' "$verifier_output" |
              sed -n 's/^package_sha256=//p')
            if [ "$(printf '%s\n' "$package_sha256" | wc -l)" -ne 1 ] ||
                ! printf '%s\n' "$package_sha256" |
                  grep -Eq '^[0-9a-f]{64}$'; then
              echo "$profile verifier emitted no unique canonical digest" >&2
              exit 1
            fi
            upper_profile=${profile^^}
            printf '%s_PACKAGE_PATH=%s\n' "$upper_profile" "$package_path" \
              >>"$GITHUB_ENV"
            printf '%s_PACKAGE_SHA256=%s\n' "$upper_profile" "$package_sha256" \
              >>"$GITHUB_ENV"
            RADEON_UNIFIED_SOURCE_REPOSITORY="$JOB_SOURCE_REPOSITORY" \
              bash scripts/test_radeon_dkms_package_verifier.sh "$package_path"
          done

      - name: Build both verified package exports against 7.x
        run: |
          set -euo pipefail
          for profile in prod all-dev; do
            if [ "$profile" = prod ]; then
              package_path=$PROD_PACKAGE_PATH
            else
              package_path=$DEV_PACKAGE_PATH
            fi
            runuser -u builder -- env RUNNER_TEMP="$BUILDER_TEMP" \
              sh scripts/with_build_slot.sh \
              timeout 15m sh scripts/check_radeon_packaged_source_compiles.sh \
                --package "$package_path" \
                --kernel-build-root "$KERNEL_BUILD_ROOT_7X" \
                --profile "$profile"
          done

      - name: Verify 7.x build-root identity after package export builds
        run: |
          python3 scripts/check_shared_build_root_identity.py \
            --root "$KERNEL_BUILD_ROOT_7X" \
            --verify "$KERNEL_BUILD_ROOT_7X_IDENTITY"

      # The container runs as root, so the lifecycle needs no privilege
      # change, and it targets the pinned headers release because uname -r
      # names the VM kernel, for which the container carries no build root.
      - name: Exercise both disposable DKMS lifecycles
        run: |
          set -euo pipefail
          evidence_parent=/var/lib/gororoba-ci/radeon-dkms-lifecycle
          install -d -m 0755 -o root -g root "$evidence_parent"
          for profile in prod dev; do
            if [ "$profile" = prod ]; then
              package_path=$PROD_PACKAGE_PATH
              package_sha256=$PROD_PACKAGE_SHA256
            else
              package_path=$DEV_PACKAGE_PATH
              package_sha256=$DEV_PACKAGE_SHA256
            fi
            evidence_dir="${evidence_parent}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${profile}"
            lifecycle_status=0
            bash scripts/test_radeon_dkms_lifecycle.sh \
              --package "$package_path" \
              --expected-sha256 "$package_sha256" \
              --kernel-release "$KERNEL_RELEASE" \
              --evidence-dir "$evidence_dir" ||
              lifecycle_status=$?
            cp -a "$evidence_dir" \
              "$PACKAGE_WORK/lifecycle-evidence-${profile}"
            [ "$lifecycle_status" -eq 0 ] || exit "$lifecycle_status"
          done

      - name: Exercise the pacman transition matrix
        run: |
          set -euo pipefail
          transition_temp="$PACKAGE_WORK/transition-temp"
          mkdir -p -- "$transition_temp"
          bash scripts/test_radeon_package_transitions.sh \
            --temp-root "$transition_temp" \
            --prod-package "$PROD_PACKAGE_PATH" \
            --dev-package "$DEV_PACKAGE_PATH" \
            --policy-package "$POLICY_PACKAGE_PATH" \
            --log-dir "$PACKAGE_WORK/transition-matrix-logs"

      # Evidence retention is not a verification step, and a step failure
      # skips every later step that carries no condition of its own, so an
      # upload refused by the account's artifact storage quota silently
      # dropped the five reproduction gates below it and failed the job on
      # a fact about storage.  continue-on-error keeps the failure visible
      # on the step while the gates that decide the package still run.
      - name: Upload transition matrix logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transition-matrix-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_WORK }}/transition-matrix-logs
          if-no-files-found: ignore
          retention-days: 1

      - name: Legacy tree manifest reproduces
        run: |
          # RUNNER_TEMP is per-job, so a cancelled run leaves nothing a later
          # verdict could read.
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/treeA.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          sh scripts/with_build_slot.sh \
            sh scripts/materialize_legacy_radeon_tree.sh \
              --dkms-conf migration/input/legacy-dkms-patch-order.conf \
              --manifest "$work/treeA.tsv"
          cmp "$work/treeA.tsv" docs/legacy-payload-0.3-91-exact-context-manifest.tsv
          echo "legacy tree manifest reproduces byte-identically"

      - name: Manifest emitter calibration
        run: sh scripts/emit_source_tree_manifest.sh --self-test

      # The capture applies the dkms.conf series in order under exact context
      # (git apply, then GNU patch at --fuzz=0), so a patch whose context has
      # drifted fails here instead of being silently relocated by DKMS's
      # default-fuzz apply. The committed effects table is the review record;
      # a series edit reproduces as a row-level difference.
      - name: Legacy patch-effects capture reproduces
        run: |
          set -euo pipefail
          python3 scripts/capture_legacy_patch_effects.py --self-test
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/effects.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/tree"
          tar xJf sources/radeon-unified-0.3-source.tar.xz -C "$work/tree"
          python3 scripts/capture_legacy_patch_effects.py \
            --tree "$work/tree" \
            --dkms-conf migration/input/legacy-dkms-patch-order.conf \
            --patches-dir patches/rs480 \
            --out "$work/effects.tsv"
          cmp "$work/effects.tsv" docs/legacy-patch-effects.tsv
          echo "legacy patch effects reproduce: 70 rows under exact-context apply"

      # The transition ledger bonds each patch to the tree mutation it
      # produces: both exact engines run per patch, a both-accept pair must
      # yield identical trees, and the walked end state must reproduce the
      # exact-context payload manifest. Git tree IDs depend only on content,
      # so the committed ledger reproduces byte-identically.
      - name: Legacy patch-transition ledger reproduces
        run: |
          set -euo pipefail
          python3 scripts/emit_legacy_patch_transitions.py --self-test
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/transitions.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/tree"
          tar xJf sources/radeon-unified-0.3-source.tar.xz -C "$work/tree"
          python3 scripts/emit_legacy_patch_transitions.py \
            --tree "$work/tree" \
            --dkms-conf migration/input/legacy-dkms-patch-order.conf \
            --patches-dir patches/rs480 \
            --out "$work/transitions.tsv" \
            --final-tree-out "$work/final"
          cmp "$work/transitions.tsv" docs/legacy-patch-transitions.tsv
          sh scripts/emit_source_tree_manifest.sh --tree "$work/final" \
            --out "$work/final.tsv"
          cmp "$work/final.tsv" docs/legacy-payload-0.3-91-exact-context-manifest.tsv
          echo "transition ledger reproduces and the walked tree matches the payload manifest"

      # Both normalized oracles derive from the recorded upstream tree object.
      # The job private archive is content-checked before it is used, so a
      # changed object or export fails against the committed upstream manifest
      # instead of producing oracles that silently describe another base.
      - name: Normalized source oracles reproduce
        run: |
          set -euo pipefail
          : "${JOB_SOURCE_REPOSITORY:?job-private source export is unset}"
          : "${JOB_UPSTREAM_RADEON_TREE:?job-private upstream Radeon tree is unset}"
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/oracles.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          # UPSTREAM_BASE.toml supplies the content address used to create the
          # archive. The committed manifest then proves the archive bytes before
          # the origin map consumes them.
          sibling=$JOB_SOURCE_REPOSITORY
          recorded=$(sed -n '/^\[/q;s/^subtree_tree[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                       "$sibling/UPSTREAM_BASE.toml" | head -1)
          [ -n "$recorded" ] || {
            echo "UPSTREAM_BASE.toml declares no subtree_tree" >&2; exit 1; }
          actual=$(git -C "$sibling" rev-parse "$recorded^{tree}")
          [ "$actual" = "$recorded" ] || {
            echo "upstream subtree is $actual, and the pin records $recorded" >&2
            exit 1
          }
          echo "upstream subtree object $actual matches the recorded pin"

          sh scripts/emit_source_tree_manifest.sh --tree "$JOB_UPSTREAM_RADEON_TREE" \
            --out "$work/upstream.tsv"
          cmp "$work/upstream.tsv" docs/upstream-radeon-v6.18-manifest.tsv
          echo "upstream radeon subtree matches the recorded v6.18 manifest"

          sh scripts/with_build_slot.sh \
            sh scripts/materialize_legacy_radeon_base.sh \
              --upstream "$JOB_UPSTREAM_RADEON_TREE" \
              --out "$work/base-tree" \
              --manifest "$work/base.tsv" \
              --normalization "$work/base-norm.tsv" \
              --prove-generated
          cmp "$work/base.tsv" docs/legacy-base-source-manifest.tsv
          cmp "$work/base-norm.tsv" docs/legacy-base-source-normalization.tsv

          # The map's closure properties run against the same trees the
          # manifests were just proved from: every changed line assigned
          # exactly once, provenance per origin kind, and the mapped atom
          # union reconstructing the base byte-identically.
          python3 scripts/check_base_delta_map_closure.py \
            --upstream "$JOB_UPSTREAM_RADEON_TREE" \
            --base "$work/base-tree" \
            --map docs/base-delta-map.tsv \
            --base-manifest docs/legacy-base-source-manifest.tsv

          sh scripts/with_build_slot.sh \
            sh scripts/normalize_legacy_source_tree.sh \
              --upstream "$JOB_UPSTREAM_RADEON_TREE" \
              --manifest "$work/final.tsv" \
              --normalization "$work/final-norm.tsv" \
              --prove-generated
          cmp "$work/final.tsv" docs/migration-oracle-0.3-91-exact-context-manifest.tsv
          cmp "$work/final-norm.tsv" docs/migration-oracle-0.3-91-exact-context-normalization.tsv

          # The two oracles differ by exactly the generator input the series
          # adds, which is the arithmetic the base-delta map depends on.
          only=$(diff <(awk -F'\t' '!/^#/ && NR > 2 { print $1 }' "$work/base.tsv") \
                      <(awk -F'\t' '!/^#/ && NR > 2 { print $1 }' "$work/final.tsv") \
                 | grep '^[<>]' || true)
          [ "$only" = "> reg_srcs/rs480" ] || {
            echo "base and final oracles differ by more than reg_srcs/rs480:" >&2
            printf '%s\n' "$only" >&2
            exit 1
          }
          echo "normalized oracles reproduce: 212 base, 213 final, reg_srcs/rs480 apart"

      # The package upload below runs on push alone and reads its path
      # from the runner.temp expression, which the runner evaluates outside
      # the container. This step runs on every event, so a pull request proves
      # that the expression names the directory the container writes before a
      # push depends on it.
      - name: runner.temp resolves inside the job container
        env:
          EXPRESSION_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          printf 'runner.temp=%s RUNNER_TEMP=%s\n' \
            "$EXPRESSION_RUNNER_TEMP" "$RUNNER_TEMP"
          [ "$EXPRESSION_RUNNER_TEMP" = "$RUNNER_TEMP" ]
          [ -d "$EXPRESSION_RUNNER_TEMP/radeon-package-artifacts" ]

      - name: Stage the target package artifact
        run: |
          set -euo pipefail
          target_transport="$PACKAGE_WORK/target-transport"
          [ ! -e "$target_transport" ]
          mkdir -p "$target_transport"
          # The split set comes from the one makepkg run above: the policy
          # package depends on radeon-unified=<exact version>, so the target
          # installs all three from one build.
          for package_path in "$PROD_PACKAGE_PATH" "$DEV_PACKAGE_PATH" \
              "$POLICY_PACKAGE_PATH"; do
            install -m 0644 "$package_path" "$target_transport/"
          done
          (
            cd "$target_transport"
            LC_ALL=C sha256sum -- ./*.pkg.tar.zst | sed 's| \./| |' >SHA256SUMS
            chmod 0644 SHA256SUMS
          )
          expected_entries=$(
            {
              basename "$PROD_PACKAGE_PATH"
              basename "$DEV_PACKAGE_PATH"
              basename "$POLICY_PACKAGE_PATH"
              echo SHA256SUMS
            } | LC_ALL=C sort
          )
          target_entries=$(find "$target_transport" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)
          [ "$target_entries" = "$expected_entries" ] || {
            echo "target transport does not contain exactly the split packages and SHA256SUMS" >&2
            printf '%s\n' "$target_entries" >&2
            exit 1
          }
          [ "$(find "$target_transport" -mindepth 1 -maxdepth 1 \
            -name 'radeon-unified-dkms-[0-9]*.pkg.tar.zst' | wc -l)" -eq 1 ] || {
            echo "target transport does not resolve one production package" >&2
            exit 1
          }
          [ "$(wc -l <"$target_transport/SHA256SUMS")" -eq 3 ]
          (cd "$target_transport" && sha256sum -c SHA256SUMS)

      - name: Upload target package artifact
        if: always() && github.event_name == 'push'
        # The package archive is the immutable input of the attended target
        # compile in ci/README.md.
        # Protected-main pushes own transport; pull requests retain no archive.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radeon-unified-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/radeon-package-artifacts/target-transport
          retention-days: 7
          if-no-files-found: error

      - name: Upload lifecycle review evidence
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radeon-lifecycle-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/radeon-package-artifacts/lifecycle-evidence-*
          retention-days: 7
          if-no-files-found: ignore

  # radeon_gem.c carries a LINUX_VERSION_CODE >= KERNEL_VERSION(7, 0, 0) split,
  # and the package job builds against 7.x, so it takes the 7.x side and
  # leaves the pre-7.0 side unbuilt. This job points the same gate at the
  # linux-lts-headers build root, which is what gives that side a compiler.
  #
  # The root is root-owned, and the compile runs as the unprivileged build
  # account. External-module compilation writes into the temporary Radeon
  # source tree, so the build needs no write access to the kernel root and
  # holds none.
  compat-6-18:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 45
    env:
      KERNEL_HEADERS_PACKAGE: linux-lts-headers
      KERNEL_HEADERS_VERSION: 6.18.54-1
      KERNEL_RELEASE: 6.18.54-1-lts
    steps:
      # actions/checkout needs git inside the container to produce a
      # repository with history, so the toolchain installs before checkout.
      - name: Install the pinned Arch toolchain
        run: |
          set -eu
          echo "Server = https://archive.archlinux.org/repos/${ARCH_ARCHIVE_SNAPSHOT}/\$repo/os/\$arch" \
            >/etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed \
            git python kmod openssh pahole linux-lts-headers
          git config --system --add safe.directory '*'
          pacman -Q python pahole linux-lts-headers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      # makepkg is absent from this job, and the compile still runs as an
      # account that cannot write the root-owned kernel build root.
      - name: Create the unprivileged build account
        run: |
          set -eu
          useradd --create-home --user-group builder
          builder_temp="${RUNNER_TEMP}/builder"
          install -d -o builder -g builder -m 0755 "$builder_temp"
          printf 'BUILDER_TEMP=%s\n' "$builder_temp" >>"$GITHUB_ENV"

      # The root is asserted from the installed package rather than assumed
      # from the package name. A pin repointed at a 7.x package fails the
      # range check instead of producing a green compatibility verdict against
      # the branch this job exists to build.
      #
      # KERNEL_VERSION(6, 18, 0) <= code < KERNEL_VERSION(7, 0, 0)
      - name: Verify the packaged 6.18 build-root identity
        run: |
          set -euo pipefail
          verdict=$(sh scripts/check_packaged_kernel_build_root.sh \
            --package "$KERNEL_HEADERS_PACKAGE" \
            --version "$KERNEL_HEADERS_VERSION" \
            --release "$KERNEL_RELEASE" \
            --version-code-range 397824:458752)
          printf 'KERNEL_BUILD_ROOT=%s\n' "${verdict#kernel_build_root=}" \
            >>"$GITHUB_ENV"

      - name: Prepare isolated 6.18 source and build-root inputs
        run: |
          set -euo pipefail
          input_root="${RUNNER_TEMP}/radeon-compat-inputs"
          mkdir -p "$input_root"
          source_repository=$(python3 -c \
            'import tomllib; print(tomllib.load(open("packaging/arch/radeon-unified-dkms/source-identity.toml", "rb"))["source_repository"])')
          git clone --quiet "https://github.com/${source_repository}.git" \
            "$input_root/source-origin"
          source_commit=$(python3 -c \
            'import tomllib; print(tomllib.load(open("packaging/arch/radeon-unified-dkms/source-identity.toml", "rb"))["source_commit"])')
          sh scripts/export_radeon_ci_source_snapshot.sh \
            --source-repository "$input_root/source-origin" \
            --source-commit "$source_commit" \
            --destination "$input_root/source"
          python3 scripts/check_radeon_source_pin.py \
            --identity packaging/arch/radeon-unified-dkms/source-identity.toml \
            --repository "$input_root/source" \
            --pkgbuild packaging/arch/radeon-unified-dkms/PKGBUILD
          python3 scripts/check_shared_build_root_identity.py \
            --root "$KERNEL_BUILD_ROOT" \
            --write "$input_root/kernel-6.18.identity.tsv"
          {
            printf 'JOB_SOURCE_REPOSITORY=%s\n' "$input_root/source"
            printf 'KERNEL_BUILD_ROOT_IDENTITY=%s\n' \
              "$input_root/kernel-6.18.identity.tsv"
          } >>"$GITHUB_ENV"

      # The proof is the pair: the gate resolves a pre-7.0 root, and
      # radeon_gem.o reaches the compiler under it. Both sides of the split live
      # in radeon_gem.c, so a filename alone identifies no branch, while a
      # successful object under a pre-7.0 version code compiles exactly the
      # branch a 7.x host skips.
      - name: Compile through the pre-7.0 compatibility branch
        run: |
          set -euo pipefail
          : "${JOB_SOURCE_REPOSITORY:?job-private source export is unset}"
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/compat618.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          runuser -u builder -- env RUNNER_TEMP="$BUILDER_TEMP" \
            sh scripts/with_build_slot.sh \
            timeout 15m sh scripts/check_radeon_pinned_source_compiles.sh \
              --source-repository "$JOB_SOURCE_REPOSITORY" \
              --kernel-build-root "$KERNEL_BUILD_ROOT" \
              --profile prod | tee "$work/compile.log"

          grep -Eq 'CC \[M\][[:space:]]+radeon_gem\.o' "$work/compile.log" || {
            echo "radeon_gem.o did not reach the compiler, so no branch was built" >&2
            exit 1
          }

          echo "pre-7.0 branch of radeon_gem.c compiled from the pinned source"

      - name: Verify 6.18 build-root identity after compile
        run: |
          python3 scripts/check_shared_build_root_identity.py \
            --root "$KERNEL_BUILD_ROOT" \
            --verify "$KERNEL_BUILD_ROOT_IDENTITY"
