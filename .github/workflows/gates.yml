# Packaging-repository gates, enforced on the self-hosted CachyOS workstation.
#
# GitHub-hosted runners cannot serve this repository: the compile verdict needs
# a CachyOS kernel build tree, and no hosted image carries one.
#
# Job placement is a security boundary rather than a convenience. These jobs
# run on pull_request, so they execute repository-controlled code from an
# unmerged branch, and they therefore select the workstation by an exclusive
# label. The RS482 target host carries no label any job here requests, so
# unmerged code cannot reach it. Target-kernel compilation is a post-merge
# qualification and lives in target-kernel.yml.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      # Each verdict-producing gate proves itself on known-good and known-bad
      # inputs before its tree verdict is trusted.
      - name: Prose gate calibration
        run: python3 scripts/check_project_prose_style.py --self-test

      - name: Prose gate
        run: python3 scripts/check_project_prose_style.py

      - name: Patch-series gate calibration
        run: sh scripts/check_radeon_patch_series_compiles.sh --self-test

      - name: ruff
        run: ruff check scripts/

      - name: shellcheck
        run: shellcheck -S error scripts/*.sh packaging/arch/radeon-unified-dkms/*.sh

      - name: ASCII only
        run: |
          # Checked-in text is plain ASCII. Tab is permitted; the patch and
          # generated-source classes keep their own bytes.
          hits=$(git ls-files '*.md' '*.sh' '*.py' '*.conf' 'PKGBUILD*' \
                 | xargs grep -lP '[^\x09\x20-\x7e]' 2>/dev/null || true)
          [ -z "$hits" ] || { echo "non-ASCII in: $hits" >&2; exit 1; }
          echo "checked-in text is plain ASCII"

  package:
    runs-on: [self-hosted, linux, cachyos, primary-compile-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: PKGBUILD sha256sums
        run: bash packaging/arch/radeon-unified-dkms/check_pkgbuild_sha256sums.sh

      - name: DKMS source hashes and patch chain
        run: bash scripts/verify_radeon_unified_dkms_sources.sh

      # One lock per physical host. Each repository serializes its own jobs,
      # and two runner services share this machine, so the lock is what keeps a
      # source build and a packaging build off the same cores and page cache.
      # Strict mode: a missing kernel build dir exits 5 rather than reporting a
      # skip as success.
      - name: Patch series applies and compiles
        run: |
          mkdir -p "$HOME/.cache/gororoba-ci"
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/check_radeon_patch_series_compiles.sh --require-compile

      - name: Legacy tree manifest reproduces
        run: |
          # RUNNER_TEMP is per-job, so a cancelled run leaves nothing a later
          # verdict could read.
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/treeA.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/materialize_legacy_radeon_tree.sh --manifest "$work/treeA.tsv"
          cmp "$work/treeA.tsv" docs/legacy-tree-a-manifest.tsv
          echo "legacy tree manifest reproduces byte-identically"
