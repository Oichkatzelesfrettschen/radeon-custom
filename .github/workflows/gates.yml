# Packaging-repository gates, enforced on the self-hosted CachyOS workstation.
#
# GitHub-hosted runners cannot serve this repository: the compile verdict needs
# a CachyOS kernel build tree, and no hosted image carries one.
#
# Job placement is a security boundary rather than a convenience. These jobs
# run on pull_request, so they execute repository-controlled code from an
# unmerged branch, and they therefore select the workstation by an exclusive
# label. The RS482 target host carries no label any job here requests, so
# unmerged code cannot reach it. Target-kernel compilation is a post-merge
# qualification and lives in target-kernel.yml.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      # Each verdict-producing gate proves itself on known-good and known-bad
      # inputs before its tree verdict is trusted.
      - name: Prose gate calibration
        run: python3 scripts/check_project_prose_style.py --self-test

      - name: Prose gate
        run: python3 scripts/check_project_prose_style.py

      - name: Patch-series gate calibration
        run: sh scripts/check_radeon_patch_series_compiles.sh --self-test

      - name: Source-pin gate calibration
        run: python3 scripts/check_radeon_source_pin.py --self-test

      - name: Tagged-source build calibration
        run: sh scripts/check_radeon_tagged_source_compiles.sh --self-test

      - name: Base-delta closure calibration
        run: python3 scripts/check_base_delta_map_closure.py --self-test

      - name: ruff
        run: ruff check scripts/

      - name: shellcheck
        run: |
          shellcheck -S error scripts/*.sh \
            packaging/arch/radeon-unified-dkms/*.sh \
            packaging/arch/radeon-unified-dkms/radeon-dkms-make

      - name: DKMS KCFLAGS composition
        run: bash scripts/test_radeon_dkms_kcflags_composition.sh

      - name: DKMS lifecycle input calibration
        run: bash scripts/test_radeon_dkms_lifecycle.sh --self-test

      - name: ASCII only
        run: |
          # Checked-in text is plain ASCII. Tab is permitted; the patch and
          # generated-source classes keep their own bytes.
          hits=$(git ls-files '*.md' '*.sh' '*.py' '*.conf' 'PKGBUILD*' \
                 | xargs grep -lP '[^\x09\x20-\x7e]' 2>/dev/null || true)
          [ -z "$hits" ] || { echo "non-ASCII in: $hits" >&2; exit 1; }
          echo "checked-in text is plain ASCII"

  package:
    runs-on: [self-hosted, linux, cachyos, primary-compile-host]
    timeout-minutes: 45
    env:
      SOURCE_REPOSITORY: ${{ vars.RADEON_UNIFIED_SOURCE_REPOSITORY }}
      KERNEL_BUILD_ROOT_71: ${{ vars.RADEON_KERNEL_BUILD_ROOT_71 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: PKGBUILD sha256sums
        run: bash packaging/arch/radeon-unified-dkms/check_pkgbuild_sha256sums.sh

      - name: DKMS source pin and package inputs
        run: |
          : "${SOURCE_REPOSITORY:?RADEON_UNIFIED_SOURCE_REPOSITORY is unset}"
          bash scripts/verify_radeon_unified_dkms_sources.sh \
            --source-repository "$SOURCE_REPOSITORY"

      # One lock per physical host. Each repository serializes its own jobs,
      # and two runner services share this machine, so the lock is what keeps a
      # source build and a packaging build off the same cores and page cache.
      - name: Tagged source builds against 7.1
        run: |
          : "${KERNEL_BUILD_ROOT_71:?RADEON_KERNEL_BUILD_ROOT_71 is unset}"
          mkdir -p "$HOME/.cache/gororoba-ci"
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            timeout 15m sh scripts/check_radeon_tagged_source_compiles.sh \
              --source-repository "$SOURCE_REPOSITORY" \
              --kernel-build-root "$KERNEL_BUILD_ROOT_71"

      - name: Build and verify legacy-equivalent package
        run: |
          set -euo pipefail
          PACKAGE_WORK="${RUNNER_TEMP}/radeon-package-artifacts"
          printf 'PACKAGE_WORK=%s\n' "$PACKAGE_WORK" >>"$GITHUB_ENV"
          mkdir -p "$PACKAGE_WORK/package"
          cp -a packaging/arch/radeon-unified-dkms/. "$PACKAGE_WORK/package/"
          (
            cd "$PACKAGE_WORK/package"
            RADEON_UNIFIED_SOURCE_URL="git+file://${SOURCE_REPOSITORY}" \
              makepkg -fC --noconfirm
          )
          package_path=$(find "$PACKAGE_WORK/package" -maxdepth 1 -type f \
            -name 'radeon-unified-dkms-*.pkg.tar.zst' | sort | tail -n 1)
          [ -n "$package_path" ] || {
            echo "makepkg produced no radeon-unified-dkms package" >&2
            exit 1
          }
          printf 'PACKAGE_PATH=%s\n' "$package_path" >>"$GITHUB_ENV"
          verifier_output=$(bash scripts/verify_radeon_unified_dkms_package.sh \
            --source-repository "$SOURCE_REPOSITORY" \
            --package "$package_path")
          printf '%s\n' "$verifier_output"
          package_sha256=$(printf '%s\n' "$verifier_output" |
            sed -n 's/^package_sha256=//p')
          if [ "$(printf '%s\n' "$package_sha256" | wc -l)" -ne 1 ] ||
              ! printf '%s\n' "$package_sha256" |
                grep -Eq '^[0-9a-f]{64}$'; then
            echo "package verifier emitted no unique canonical digest" >&2
            exit 1
          fi
          printf 'PACKAGE_SHA256=%s\n' "$package_sha256" >>"$GITHUB_ENV"
          RADEON_UNIFIED_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            bash scripts/test_radeon_dkms_package_verifier.sh "$package_path"

      - name: Exercise disposable DKMS lifecycle
        run: |
          set -euo pipefail
          evidence_parent=/var/lib/gororoba-ci/radeon-dkms-lifecycle
          evidence_dir="${evidence_parent}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0755 -o root -g root "$evidence_parent"
          lifecycle_status=0
          sudo bash scripts/test_radeon_dkms_lifecycle.sh \
            --package "$PACKAGE_PATH" \
            --expected-sha256 "$PACKAGE_SHA256" \
            --kernel-release "$(uname -r)" \
            --evidence-dir "$evidence_dir" ||
            lifecycle_status=$?
          sudo cp -a "$evidence_dir" "$PACKAGE_WORK/lifecycle-evidence"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_WORK/lifecycle-evidence"
          exit "$lifecycle_status"

      - name: Legacy tree manifest reproduces
        run: |
          # RUNNER_TEMP is per-job, so a cancelled run leaves nothing a later
          # verdict could read.
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/treeA.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/materialize_legacy_radeon_tree.sh \
              --dkms-conf migration/input/legacy-dkms-patch-order.conf \
              --manifest "$work/treeA.tsv"
          cmp "$work/treeA.tsv" docs/legacy-payload-0.3-91-exact-context-manifest.tsv
          echo "legacy tree manifest reproduces byte-identically"

      - name: Manifest emitter calibration
        run: sh scripts/emit_source_tree_manifest.sh --self-test

      # The capture applies the dkms.conf series in order under exact context
      # (git apply, then GNU patch at --fuzz=0), so a patch whose context has
      # drifted fails here instead of being silently relocated by DKMS's
      # default-fuzz apply. The committed effects table is the review record;
      # a series edit reproduces as a row-level difference.
      - name: Legacy patch-effects capture reproduces
        run: |
          set -euo pipefail
          python3 scripts/capture_legacy_patch_effects.py --self-test
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/effects.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/tree"
          tar xJf sources/radeon-unified-0.3-source.tar.xz -C "$work/tree"
          python3 scripts/capture_legacy_patch_effects.py \
            --tree "$work/tree" \
            --dkms-conf migration/input/legacy-dkms-patch-order.conf \
            --patches-dir patches/rs480 \
            --out "$work/effects.tsv"
          cmp "$work/effects.tsv" docs/legacy-patch-effects.tsv
          echo "legacy patch effects reproduce: 70 rows under exact-context apply"

      # The transition ledger bonds each patch to the tree mutation it
      # produces: both exact engines run per patch, a both-accept pair must
      # yield identical trees, and the walked end state must reproduce the
      # exact-context payload manifest. Git tree IDs depend only on content,
      # so the committed ledger reproduces byte-identically.
      - name: Legacy patch-transition ledger reproduces
        run: |
          set -euo pipefail
          python3 scripts/emit_legacy_patch_transitions.py --self-test
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/transitions.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/tree"
          tar xJf sources/radeon-unified-0.3-source.tar.xz -C "$work/tree"
          python3 scripts/emit_legacy_patch_transitions.py \
            --tree "$work/tree" \
            --dkms-conf migration/input/legacy-dkms-patch-order.conf \
            --patches-dir patches/rs480 \
            --out "$work/transitions.tsv" \
            --final-tree-out "$work/final"
          cmp "$work/transitions.tsv" docs/legacy-patch-transitions.tsv
          sh scripts/emit_source_tree_manifest.sh --tree "$work/final" \
            --out "$work/final.tsv"
          cmp "$work/final.tsv" docs/legacy-payload-0.3-91-exact-context-manifest.tsv
          echo "transition ledger reproduces and the walked tree matches the payload manifest"

      # Both normalized oracles derive from pristine upstream, so the upstream
      # tree is content-checked before it is used. A path repointed at a
      # different revision fails against the committed upstream manifest instead
      # of producing oracles that silently describe another base.
      - name: Normalized source oracles reproduce
        env:
          UPSTREAM_RADEON_TREE: ${{ vars.RADEON_UPSTREAM_RADEON_TREE }}
        run: |
          set -euo pipefail
          : "${UPSTREAM_RADEON_TREE:?RADEON_UPSTREAM_RADEON_TREE is unset}"
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/oracles.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          # The manifest was emitted from this path, so comparing the path back
          # against it detects working-tree drift and a repointed variable and
          # says nothing about which upstream revision the manifest describes.
          # The tree object closes that: linux-radeon-gororoba's
          # UPSTREAM_BASE.toml is the one home for the recorded subtree, and git
          # object IDs are content addresses, so a checkout at another revision
          # fails here rather than supplying a wrong left side to the origin map.
          sibling=$(git -C "$UPSTREAM_RADEON_TREE" rev-parse --show-toplevel)
          recorded=$(sed -n '/^\[/q;s/^subtree_tree[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                       "$sibling/UPSTREAM_BASE.toml" | head -1)
          [ -n "$recorded" ] || {
            echo "UPSTREAM_BASE.toml declares no subtree_tree" >&2; exit 1; }
          actual=$(git -C "$sibling" rev-parse HEAD:drivers/gpu/drm/radeon)
          [ "$actual" = "$recorded" ] || {
            echo "upstream subtree is $actual, and the pin records $recorded" >&2
            exit 1
          }
          echo "upstream subtree object $actual matches the recorded pin"

          sh scripts/emit_source_tree_manifest.sh --tree "$UPSTREAM_RADEON_TREE" \
            --out "$work/upstream.tsv"
          cmp "$work/upstream.tsv" docs/upstream-radeon-v6.18-manifest.tsv
          echo "upstream radeon subtree matches the recorded v6.18 manifest"

          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/materialize_legacy_radeon_base.sh \
              --upstream "$UPSTREAM_RADEON_TREE" \
              --out "$work/base-tree" \
              --manifest "$work/base.tsv" \
              --normalization "$work/base-norm.tsv" \
              --prove-generated
          cmp "$work/base.tsv" docs/legacy-base-source-manifest.tsv
          cmp "$work/base-norm.tsv" docs/legacy-base-source-normalization.tsv

          # The map's closure properties run against the same trees the
          # manifests were just proved from: every changed line assigned
          # exactly once, provenance per origin kind, and the mapped atom
          # union reconstructing the base byte-identically.
          python3 scripts/check_base_delta_map_closure.py \
            --upstream "$UPSTREAM_RADEON_TREE" \
            --base "$work/base-tree" \
            --map docs/base-delta-map.tsv \
            --base-manifest docs/legacy-base-source-manifest.tsv

          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/normalize_legacy_source_tree.sh \
              --upstream "$UPSTREAM_RADEON_TREE" \
              --manifest "$work/final.tsv" \
              --normalization "$work/final-norm.tsv" \
              --prove-generated
          cmp "$work/final.tsv" docs/migration-oracle-0.3-91-exact-context-manifest.tsv
          cmp "$work/final-norm.tsv" docs/migration-oracle-0.3-91-exact-context-normalization.tsv

          # The two oracles differ by exactly the generator input the series
          # adds, which is the arithmetic the base-delta map depends on.
          only=$(diff <(awk -F'\t' '!/^#/ && NR > 2 { print $1 }' "$work/base.tsv") \
                      <(awk -F'\t' '!/^#/ && NR > 2 { print $1 }' "$work/final.tsv") \
                 | grep '^[<>]' || true)
          [ "$only" = "> reg_srcs/rs480" ] || {
            echo "base and final oracles differ by more than reg_srcs/rs480:" >&2
            printf '%s\n' "$only" >&2
            exit 1
          }
          echo "normalized oracles reproduce: 212 base, 213 final, reg_srcs/rs480 apart"

      - name: Upload package and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: radeon-unified-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/radeon-package-artifacts
          retention-days: 30
          if-no-files-found: warn

  # radeon_gem.c carries a LINUX_VERSION_CODE >= KERNEL_VERSION(7, 0, 0) split,
  # and both runners run 7.x, so every other compile job takes the 7.x side and
  # leaves the pre-7.0 side unbuilt. This job points the same gate at a retained
  # 6.18 kernel build tree, which is what gives that side a compiler.
  #
  # The tree is root-owned and read-only. External-module compilation writes
  # into the temporary Radeon source tree, so the job needs no write access to
  # it and holds none.
  compat-6-18:
    runs-on: [self-hosted, linux, cachyos, primary-compile-host]
    timeout-minutes: 45
    env:
      KERNEL_BUILD_ROOT: ${{ vars.RADEON_KERNEL_BUILD_ROOT_618 }}
      SOURCE_REPOSITORY: ${{ vars.RADEON_UNIFIED_SOURCE_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      # The retained tree is a workspace-local path, so its identity is asserted
      # from the repository rather than assumed from the variable. A variable
      # repointed at a 7.x tree fails the range check instead of producing a
      # green compatibility verdict against the branch this job exists to build.
      - name: Verify retained 6.18 build-tree identity
        run: |
          set -euo pipefail
          : "${KERNEL_BUILD_ROOT:?RADEON_KERNEL_BUILD_ROOT_618 is unset}"

          release=$(cat "$KERNEL_BUILD_ROOT/include/config/kernel.release")
          code=$(awk '$1 == "#define" && $2 == "LINUX_VERSION_CODE" { print $3 }' \
                   "$KERNEL_BUILD_ROOT/include/generated/uapi/linux/version.h")

          [ "$release" = "6.18.38-2-cachyos-lts" ] || {
            echo "unexpected retained kernel release: $release" >&2
            exit 1
          }

          # KERNEL_VERSION(6,18,0) <= code < KERNEL_VERSION(7,0,0)
          [ "$code" -ge 397824 ] && [ "$code" -lt 458752 ] || {
            echo "version code $code does not exercise the pre-7.0 branch" >&2
            exit 1
          }

          ( cd "$KERNEL_BUILD_ROOT" && sha256sum -c \
              "$GITHUB_WORKSPACE/ci/kernel-build-roots/6.18.38-2-cachyos-lts.sha256" )

          # Byte completeness: every file in the retained tree hashes against
          # the full manifest, and the count equality rejects files the
          # manifest never listed, so a root with injected or replaced content
          # fails rather than passing on its six identity files alone.
          ( cd "$KERNEL_BUILD_ROOT" && sha256sum -c --quiet \
              "$GITHUB_WORKSPACE/ci/kernel-build-roots/6.18.38-2-cachyos-lts.full.sha256" )
          tree_files=$(find "$KERNEL_BUILD_ROOT" -type f | wc -l)
          manifest_files=$(wc -l < ci/kernel-build-roots/6.18.38-2-cachyos-lts.full.sha256)
          [ "$tree_files" -eq "$manifest_files" ] || {
            echo "retained tree carries $tree_files files, manifest lists $manifest_files" >&2
            exit 1
          }

          echo "retained compatibility tree: $release, LINUX_VERSION_CODE=$code, $tree_files files byte-verified"

      # The proof is the pair: the gate resolves a pre-7.0 root, and
      # radeon_gem.o reaches the compiler under it. Both sides of the split live
      # in radeon_gem.c, so a filename alone identifies no branch, while a
      # successful object under a pre-7.0 version code compiles exactly the
      # branch a 7.x host skips.
      - name: Compile through the pre-7.0 compatibility branch
        run: |
          set -euo pipefail
          : "${SOURCE_REPOSITORY:?RADEON_UNIFIED_SOURCE_REPOSITORY is unset}"
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/compat618.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          mkdir -p "$HOME/.cache/gororoba-ci"
          flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            timeout 15m sh scripts/check_radeon_tagged_source_compiles.sh \
              --source-repository "$SOURCE_REPOSITORY" \
              --kernel-build-root "$KERNEL_BUILD_ROOT" | tee "$work/compile.log"

          grep -Eq 'CC \[M\][[:space:]]+radeon_gem\.o' "$work/compile.log" || {
            echo "radeon_gem.o did not reach the compiler, so no branch was built" >&2
            exit 1
          }

          echo "pre-7.0 branch of radeon_gem.c compiled from the pinned source"
